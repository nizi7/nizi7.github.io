<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friend UID - Nizi</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg, #00102f, #003b99, #00102f);
}
.container {
    width: 100%;
    max-width: 450px;
    padding: 28px 20px;
    text-align: center;
    border: 2px solid #00dfff;
    border-radius: 25px;
    background: #ffffff10;
    box-shadow: 0 0 25px #007bff, 0 0 30px #a000ff;
}
h1 {
    margin-bottom: 25px;
    color: #8cf6ff;
    text-shadow: 0 0 12px #00cfff;
}
.uid-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
}
.uid {
    padding: 15px 10px;
    border: 1px solid #00dfff;
    border-radius: 12px;
    background: #ffffff12;
    font-size: 17px;
    overflow-wrap: anywhere;
}
.home-btn {
    display: block;
    margin-top: 25px;
    padding: 14px;
    border-radius: 25px;
    background: linear-gradient(90deg, #00eaff, #ff70d5);
    color: #071d49;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>
<body>
<main class="container">
    <h1>👥 Friend UID</h1>
    <div class="uid-list">
        <div class="uid">Sujith: 2946003304</div>
        <div class="uid">Kiccha: 17709431173</div>
