<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nizi Ninja 3D</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  touch-action: none;
}

body {
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

#game {
  width: 100vw;
  height: 100vh;
  position: relative;
}

#ui {
  position: absolute;
  top: 15px;
  left: 15px;
  z-index: 10;
  color: white;
  font-size: 20px;
  text-shadow: 0 0 8px #00aaff;
}

#title {
  font-size: 25px;
  font-weight: bold;
  margin-bottom: 5px;
}

#controls {
  position: absolute;
  bottom: 20px;
  left: 0;
  right: 0;
  z-index: 20;
  display: flex;
  justify-content: space-between;
  padding: 0 20px;
}

.control-group {
  display: flex;
  gap: 12px;
}

button {
  width: 65px;
  height: 65px;
  border: 2px solid #00aaff;
  border-radius: 18px;
  background: rgba(0,0,0,0.65);
  color: white;
  font-size: 25px;
  box-shadow: 0 0 15px #008cff;
}

button:active {
  transform: scale(0.9);
  background: #0066aa;
}

#attack {
  width: 90px;
  border-color: #ff4444;
  box-shadow: 0 0 15px #ff2222;
}
</style>
</head>

<body>
<!-- CHARACTER SELECT -->
<div id="characterSelect">

  <h1>🥷 NIZI NINJA</h1>
  <p>Select Your Ninja</p>

  <div class="characters">

    <button onclick="selectCharacter('male')" class="character male">
      <div class="ninja-icon">🥷</div>
      <b>MALE NINJA</b>
      <small>⚡ Blue Shadow</small>
    </button>

    <button onclick="selectCharacter('female')" class="character female">
      <div class="ninja-icon">🥷</div>
      <b>FEMALE NINJA</b>
      <small>✨ Rose Glow</small>
    </button>

  </div>

</div>

<style>
#characterSelect {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #050510, #101044);
  color: white;
  text-align: center;
}

#characterSelect h1 {
  font-size: 34px;
  margin-bottom: 8px;
  text-shadow: 0 0 15px #00aaff;
}

#characterSelect p {
  margin-bottom: 25px;
  font-size: 18px;
}

.characters {
  display: flex;
  gap: 20px;
}

.character {
  width: 150px;
  height: 190px;
  border-radius: 20px;
  color: white;
  background: #111;
  border: 2px solid #00aaff;
  box-shadow: 0 0 20px #008cff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.character.female {
  border-color: #ff66bb;
  box-shadow: 0 0 20px #ff3388;
}

.ninja-icon {
  font-size: 65px;
  filter: drop-shadow(0 0 12px #00aaff);
}

.female .ninja-icon {
  filter: drop-shadow(0 0 12px #ff55aa);
}

.character b {
  font-size: 15px;
}

.character small {
  font-size: 12px;
}

.character:active {
  transform: scale(0.94);
}
</style>

<script>
function selectCharacter(type) {

  const menu = document.getElementById("characterSelect");

  menu.style.opacity = "0";
  menu.style.transition = "opacity 0.5s";

  setTimeout(() => {
    menu.style.display = "none";
  }, 500);

  if (type === "male") {
    localStorage.setItem("niziCharacter", "male");
  } else {
    localStorage.setItem("niziCharacter", "female");
  }
}
</script>
<div id="game">

  <div id="ui">
    <div id="title">🥷 NIZI NINJA</div>
    <div>⭐ Score: <span id="score">0</span></div>
    <div>❤️ HP: <span id="hp">100</span></div>
  </div>

  <div id="controls">
    <div class="control-group">
      <button id="left">⬅️</button>
      <button id="right">➡️</button>
    </div>

    <div class="control-group">
      <button id="jump">⬆️</button>
      <button id="attack">⚔️</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene;
let camera;
let renderer;

let ninja;
let enemy;

let score = 0;
let hp = 100;

let playerX = 0;
let playerY = 1;

let jumping = false;
let attacking = false;

const scoreText = document.getElementById("score");
const hpText = document.getElementById("hp");


// SCENE
scene = new THREE.Scene();

scene.background = new THREE.Color(0x050510);


// CAMERA
camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(0, 4, 8);
camera.lookAt(0, 1, 0);


// LIGHT
const light = new THREE.HemisphereLight(
  0xffffff,
  0x222244,
  2
);

scene.add(light);


// GROUND
const groundGeometry = new THREE.BoxGeometry(30, 0.5, 10);

const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x151525
});

const ground = new THREE.Mesh(
  groundGeometry,
  groundMaterial
);

ground.position.y = -0.25;

scene.add(ground);


// NINJA
ninja = new THREE.Group();


// Body
const bodyGeometry = new THREE.BoxGeometry(
  0.8,
  1.2,
  0.5
);

const ninjaMaterial = new THREE.MeshStandardMaterial({
  color: 0x111111
});

const body = new THREE.Mesh(
  bodyGeometry,
  ninjaMaterial
);

body.position.y = 1.1;

ninja.add(body);


// Head
const headGeometry = new THREE.SphereGeometry(
  0.45,
  20,
  20
);

const head = new THREE.Mesh(
  headGeometry,
  ninjaMaterial
);

head.position.y = 2;

ninja.add(head);


// Eyes
const eyeGeometry = new THREE.BoxGeometry(
  0.35,
  0.08,
  0.05
);

const eyeMaterial = new THREE.MeshStandardMaterial({
  color: 0x00aaff,
  emissive: 0x00aaff
});

const eyes = new THREE.Mesh(
  eyeGeometry,
  eyeMaterial
);

eyes.position.set(0, 2.05, -0.43);

ninja.add(eyes);


// Position
ninja.position.set(0, 0, 0);

scene.add(ninja);


// ENEMY
const enemyGeometry = new THREE.BoxGeometry(
  1,
  1.5,
  1
);

const enemyMaterial = new THREE.MeshStandardMaterial({
  color: 0xaa1111,
  emissive: 0x330000
});

enemy = new THREE.Mesh(
  enemyGeometry,
  enemyMaterial
);

enemy.position.set(5, 0.75, 0);

scene.add(enemy);


// RENDERER
renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

document.getElementById("game").appendChild(
  renderer.domElement
);


// MOVE
function moveLeft() {

  playerX -= 0.5;

  if (playerX < -6) {
    playerX = -6;
  }

  ninja.position.x = playerX;
}


function moveRight() {

  playerX += 0.5;

  if (playerX > 6) {
    playerX = 6;
  }

  ninja.position.x = playerX;
}


// JUMP
function jump() {

  if (jumping) return;

  jumping = true;

  let start = performance.now();

  function jumpAnimation(time) {

    let t = (time - start) / 600;

    if (t < 1) {

      playerY = 1.5 * Math.sin(t * Math.PI);

      ninja.position.y = playerY;

      requestAnimationFrame(jumpAnimation);

    } else {

      ninja.position.y = 0;
      playerY = 1;
      jumping = false;
    }
  }

  requestAnimationFrame(jumpAnimation);
}


// ATTACK
function attack() {

  if (attacking) return;

  attacking = true;

  ninja.rotation.y = -0.4;

  let distance =
    Math.abs(ninja.position.x - enemy.position.x);

  if (distance < 2) {

    score += 10;

    scoreText.textContent = score;

    enemy.position.x = 7;

  }

  setTimeout(() => {

    ninja.rotation.y = 0;
    attacking = false;

  }, 250);
}


// ENEMY MOVEMENT
function updateEnemy() {

  enemy.position.x -= 0.025;

  if (enemy.position.x < -7) {

    enemy.position.x = 7;

  }

  let distance =
    Math.abs(ninja.position.x - enemy.position.x);

  if (distance < 0.9 && !attacking) {

    hp -= 1;

    hpText.textContent = hp;

    enemy.position.x = 7;

    if (hp <= 0) {

      alert(
        "🥷 Game Over!\nScore: " + score
      );

      location.reload();
    }
  }
}


// BUTTONS
document.getElementById("left")
.addEventListener("click", moveLeft);

document.getElementById("right")
.addEventListener("click", moveRight);

document.getElementById("jump")
.addEventListener("click", jump);

document.getElementById("attack")
.addEventListener("click", attack);


// KEYBOARD
document.addEventListener("keydown", function(e) {

  if (e.key === "ArrowLeft") {
    moveLeft();
  }

  if (e.key === "ArrowRight") {
    moveRight();
  }

  if (e.key === "ArrowUp" || e.key === " ") {
    jump();
  }

  if (e.key === "Enter") {
    attack();
  }

});


// GAME LOOP
function animate() {

  requestAnimationFrame(animate);

  updateEnemy();

  camera.position.x +=
    (ninja.position.x - camera.position.x) * 0.05;

  camera.lookAt(
    ninja.position.x,
    1,
    0
  );

  renderer.render(
    scene,
    camera
  );
}

animate();


// SCREEN RESIZE
window.addEventListener("resize", function() {

  camera.aspect =
    window.innerWidth /
    window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});

</script>

</body>
</html>
