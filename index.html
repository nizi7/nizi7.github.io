<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nizi - My Website</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg, #001f3f, #0066cc, #001f3f);
    overflow-x: hidden;
}

/* ---------- LOGIN ---------- */

#loginPage {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

.title {
    position: absolute;
    top: 55px;
    width: 100%;
    text-align: center;
    font-size: 27px;
    color: #eafcff;
    text-shadow:
        0 0 6px #8eeaff,
        0 0 14px #8eeaff,
        0 0 22px #ffb6cc;
    animation: glow 2.5s ease-in-out infinite alternate;
}

@keyframes glow {
    from {
        text-shadow:
            0 0 5px #8eeaff,
            0 0 12px #8eeaff;
    }
    to {
        text-shadow:
            0 0 8px #8eeaff,
            0 0 18px #ffb6cc,
            0 0 30px #ffb6cc;
    }
}

.login-box {
    width: 90%;
    max-width: 360px;
    padding: 35px 25px;
    border-radius: 20px;
    text-align: center;

    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    box-shadow:
        0 0 25px rgba(142,234,255,0.25),
        0 0 25px rgba(255,182,204,0.15);
}

.login-box h2 {
    margin-bottom: 25px;
}

.input {
    width: 100%;
    padding: 13px;
    margin: 10px 0;

    border: none;
    outline: none;
    border-radius: 10px;

    background: rgba(255,255,255,0.15);
    color: white;
}

.input::placeholder {
    color: #ddd;
}

.login-btn,
.menu-btn {
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

.login-btn {
    width: 100%;
    padding: 13px;
    margin-top: 15px;
    background: linear-gradient(90deg, #8eeaff, #ffb6cc);
    color: #001f3f;
}

.login-btn:hover,
.menu-btn:hover {
    transform: scale(1.05);
    box-shadow:
        0 0 12px #8eeaff,
        0 0 20px #ffb6cc;
}

/* ---------- HOME ---------- */

#homePage {
    display: none;
    min-height: 100vh;
    padding: 30px 20px;
    text-align: center;
}

.home-title {
    margin-top: 20px;
    font-size: 34px;
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    50% {
        transform: translateY(-8px);
    }
}

.welcome {
    margin-top: 10px;
    color: #dffaff;
}

/* ---------- MENU ---------- */

.menu {
    margin: 35px auto;
    max-width: 500px;
}

.menu-btn {
    width: 100%;
    padding: 15px;
    margin: 8px 0;

    color: white;
    background: rgba(255,255,255,0.13);
    border: 1px solid rgba(255,255,255,0.2);
}

/* ---------- ABOUT ---------- */

#about {
    display: none;
    max-width: 500px;
    margin: 25px auto;
    padding: 25px;

    border-radius: 20px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.22);

    backdrop-filter: blur(15px);
}

#about h2 {
    margin-bottom: 20px;
}

.detail {
    padding: 12px;
    margin: 8px 0;
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
}

.logout {
    margin-top: 25px;
    padding: 12px 25px;
    background: #ffb6cc;
    color: #001f3f;
}

/* ---------- RESPONSIVE ---------- */

@media (max-width: 400px) {
    .title {
        font-size: 22px;
        padding: 0 10px;
    }

    .home-title {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->

<section id="loginPage">

    <h1 class="title">
        ɴɪᴢɪ ʜɪ ɢᴜʏs ɪᴀᴍ ᴜᴋ
    </h1>

    <div class="login-box">

        <h2>Login</h2>

        <input
            class="input"
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            class="input"
            type="password"
            id="password"
            placeholder="Password"
        >

        <button class="login-btn" onclick="loginUser()">
            LOGIN
        </button>

    </div>

</section>

<!-- HOME PAGE -->

<section id="homePage">

    <h1 class="home-title">
        Hollo My Friend
    </h1>

    <p class="welcome">
        I Am Python 🐍
    </p>

    <div class="menu">

        <button class="menu-btn" onclick="showAbout()">
            👤 About Me
        </button>

        <button class="menu-btn" onclick="showMessage()">
            ✨ Details
        </button>

    </div>


    <!-- ABOUT ME -->

    <div id="about">

        <h2>About Me</h2>

        <div class="detail">
            <b>Name:</b> Nizi
        </div>

        <div class="detail">
            <b>Age:</b> 15
        </div>

        <div class="detail">
            <b>Skills:</b> Ai Using, Website Creating, App Making
        </div>

        <div class="detail">
            <b>FC:</b> Blue
        </div>

    </div>


    <button class="menu-btn logout" onclick="logoutUser()">
        Logout
    </button>

</section>


<script>

function loginUser() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    if (username !== "" && password !== "") {

        document.getElementById("loginPage").style.display =
            "none";

        document.getElementById("homePage").style.display =
            "block";

    } else {

        alert("Please enter Username and Password");

    }
}


function showAbout() {

    const about =
        document.getElementById("about");

    if (about.style.display === "block") {

        about.style.display = "none";

    } else {

        about.style.display = "block";

    }
}


function showMessage() {

    alert("Welcome to Nizi Website ✨");

}


function logoutUser() {

    document.getElementById("homePage").style.display =
        "none";

    document.getElementById("loginPage").style.display =
        "flex";

    document.getElementById("username").value = "";

    document.getElementById("password").value = "";

    document.getElementById("about").style.display =
        "none";
}

</script>

</body>
</html>
