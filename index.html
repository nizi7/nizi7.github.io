
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nizi - My Website</title>
<link rel="stylesheet" href="style.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(ellipse at 10% 10%, #006bff, transparent 38%),
        radial-gradient(ellipse at 90% 75%, #003bff, transparent 40%),
        linear-gradient(135deg, #00102f, #002b70, #00102f);
    overflow-x: hidden;
}

/* LOGIN */

#loginPage {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    padding: 100px 20px 30px;
}

.title {
    position: absolute;
    top: 45px;
    width: 100%;
    padding: 0 10px;
    text-align: center;
    font-size: clamp(21px, 5vw, 30px);
    color: #eafcff;
    text-shadow: 0 0 8px #00dfff, 0 0 20px #ff50ed;
    animation: glow 2s infinite alternate;
}

.login-box {
    width: min(400px, 100%);
    padding: 30px 25px;
    text-align: center;
    border: 1px solid #00dfff;
    border-radius: 25px;
    background: #ffffff12;
    backdrop-filter: blur(15px);
    box-shadow: 0 0 25px #007bff, 0 0 35px #a000ff;
}

.login-box h2 {
    margin-bottom: 20px;
    font-size: 30px;
    color: #7df6ff;
}

.input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border: 1px solid #61dfff;
    border-radius: 12px;
    outline: none;
    background: #ffffff14;
    color: white;
    font-size: 16px;
}

.input::placeholder {
    color: #ddd;
}

.login-btn, .menu-btn, .close-btn {
    cursor: pointer;
    font-weight: bold;
    font-family: inherit;
}

.login-btn {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 30px;
    color: #082454;
    background: linear-gradient(100deg, #00eaff, #ff8bd5);
    font-size: 18px;
}

/* HOME */

#homePage {
    display: none;
    min-height: 100vh;
    padding: 25px 18px 40px;
    text-align: center;
}

.container {
    width: 100%;
    max-width: 710px;
    margin: auto;
}

.home-title {
    margin: 25px 0 18px;
    font-size: clamp(35px, 7vw, 62px);
    background: linear-gradient(90deg, white, #00eaff, #ff43ed);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 10px #008cff);
    animation: float 3s ease-in-out infinite;
}

.subtitle {
    font-size: clamp(25px, 5vw, 40px);
    margin-bottom: 36px;
}

#welcomeBtn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    width: min(360px, 90%);
    margin: 0 auto 42px;
    padding: 20px;
    border: none;
    border-radius: 50px;
    color: white;
    background: linear-gradient(100deg, #00dfff, #168cff, #ff70d5);
    box-shadow: 0 0 22px #00cfff;
    font-size: 25px;
    font-weight: bold;
    cursor: pointer;
}

/* NEON MENU */

.menu {
    display: flex;
    flex-direction: column;
    gap: 27px;
    margin: 25px auto 0;
}

.menu-btn, .game-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    width: 100%;
    min-height: 100px;
    padding: 15px 20px;
    border: 3px solid transparent;
    border-radius: 65px;
    color: white;
    background:
        linear-gradient(110deg, #007fff, #003bce 65%, #8d00ff)
        padding-box,
        linear-gradient(100deg, #00f5ff, white, #ff37ef)
        border-box;
    box-shadow: 0 0 12px #00eaff, 0 0 27px #007bff;
    font-size: clamp(19px, 4.5vw, 31px);
    transition: transform .25s, box-shadow .25s;
    animation: glow 2.5s infinite alternate;
}

.menu-btn:hover, .game-btn:hover {
    transform: scale(1.025);
    box-shadow: 0 0 20px #00eaff, 0 0 40px #ff37ef;
}

.menu-icon {
    flex: 0 0 20%;
    text-align: center;
    font-size: 37px;
}

.separator {
    width: 2px;
    height: 42px;
    flex-shrink: 0;
    background: #ffffff80;
}

.menu-label {
    flex: 1;
    text-align: left;
}

.arrow {
    font-size: 42px;
    font-weight: normal;
}

.game-btn {
    text-decoration: none;
}

.game-label {
    background: linear-gradient(90deg, #00f5ff, #ff50ed);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-decoration: underline;
    text-underline-offset: 6px;
    overflow-wrap: anywhere;
}

/* DETAILS PANELS */

.panel {
    display: none;
    width: 100%;
    margin: 30px auto 0;
    padding: 25px 20px;
    border: 2px solid #00dfff;
    border-radius: 25px;
    background: linear-gradient(145deg, #062e70ee, #18094fee);
    box-shadow: 0 0 22px #00cfff, 0 0 30px #9c00ff;
    text-align: center;
    animation: appear .3s ease;
}

.panel.active {
    display: block;
}

.panel h2 {
    margin-bottom: 20px;
    color: #75f5ff;
    font-size: 28px;
}

.detail {
    padding: 14px 12px;
    margin: 10px 0;
    border: 1px solid #54cfff80;
    border-radius: 13px;
    background: #ffffff0d;
    font-size: 17px;
    overflow-wrap: anywhere;
}

/* NCP MINI PICTURES */

.ncp-gallery {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
}

.ncp-gallery img {
    width: 55px;
    height: 55px;
    object-fit: cover;
    border: 2px solid #00eaff;
    border-radius: 10px;
    box-shadow: 0 0 10px #00cfff;
}

.close-btn {
    margin-top: 20px;
    padding: 13px 30px;
    border: none;
    border-radius: 30px;
    color: #092454;
    background: linear-gradient(90deg, #00eaff, #ff70d5);
    font-size: 17px;
}

.logout {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    width: 94%;
    min-height: 85px;
    margin: 45px auto 20px;
    border: none;
    border-radius: 28px;
    background: linear-gradient(100deg, #ff9ad9, #ff80bb);
    color: #082454;
    box-shadow: none;
    font-size: 26px;
}

/* ANIMATIONS */

@keyframes glow {
    from { filter: brightness(1); }
    to { filter: brightness(1.15); }
}

@keyframes float {
    50% { transform: translateY(-7px); }
}

@keyframes appear {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 400px) {
    #homePage { padding: 20px 14px 30px; }

    .menu { gap: 24px; }

    .menu-btn, .game-btn {
        min-height: 85px;
        padding: 12px;
        gap: 9px;
    }

    .menu-icon { font-size: 29px; }
    .arrow { font-size: 33px; }
    .separator { height: 35px; }
    .logout { min-height: 72px; font-size: 23px; }
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->

<section id="loginPage">
    <h1 class="title">ɴɪᴢɪ ʜɪ ɢᴜʏs ɪᴀᴍ ᴜᴋ</h1>

    <div class="login-box">
        <h2>Login</h2>

        <input class="input" type="text"
               id="username" placeholder="Username"
               autocomplete="username">

        <input class="input" type="password"
               id="password" placeholder="Password"
               autocomplete="current-password">

        <button class="login-btn" onclick="loginUser()">
            LOGIN
        </button>
    </div>
</section>

<!-- HOME PAGE -->

<section id="homePage">
<div class="container">

    <h1 class="home-title">Hollo My Friend</h1>
    <p class="subtitle">I Am Python 🐍</p>

    <button onclick="playWelcome()" id="welcomeBtn">
        <span>👤</span><span>│</span><span>Welcome</span>
    </button>

    <nav class="menu">

        <button class="menu-btn" onclick="togglePanel('about')">
            <span class="menu-icon">✨</span>
            <span class="separator"></span>
            <span class="menu-label">About Me</span>
            <span class="arrow">›</span>
        </button>

        <button class="menu-btn" onclick="togglePanel('details')">
            <span class="menu-icon">✨</span>
            <span class="separator"></span>
            <span class="menu-label">Details</span>
            <span class="arrow">›</span>
        </button>

        <button class="menu-btn" onclick="togglePanel('skill')">
            <span class="menu-icon">&lt;/&gt;</span>
            <span class="separator"></span>
            <span class="menu-label">Skill</span>
            <span class="arrow">›</span>
        </button>

        <button class="menu-btn" onclick="togglePanel('ncp')">
            <span class="menu-icon">▧</span>
            <span class="separator"></span>
            <span class="menu-label">NCP</span>
            <span class="arrow">›</span>
        </button>

<a href="friend-uid.html" class="menu-btn" style="text-decoration:none;">
    <span class="menu-icon">👥</span>
    <span class="separator"></span>
    <span class="menu-label">Friend UID</span>
    <span class="arrow">›</span>
</a>
        <a href="game.html" class="menu-btn game-btn">
            <span class="menu-icon">🎮</span>
            <span class="separator"></span>
            <span class="menu-label game-label">
                Play Nizi Ninja 3D
            </span>
            <span class="arrow">›</span>
        </a>

    </nav>

    <!-- ABOUT ME -->

    <section class="panel" id="about">
        <h2>✨ About Me</h2>
        <div class="detail"><b>Name:</b> Nizi</div>
        <div class="detail"><b>FC:</b> Blue</div>
        <button class="close-btn" onclick="closePanels()">Close</button>
    </section>

    <!-- DETAILS -->

    <section class="panel" id="details">
        <h2>✨ Details</h2>
        <div class="detail"><b>Name:</b> Nizi</div>
        <div class="detail"><b>Age:</b> 15</div>
        <div class="detail"><b>Favourite Colour:</b> Blue</div>
        <div class="detail"><b>Website:</b> Nizi</div>
        <button class="close-btn" onclick="closePanels()">Close</button>
    </section>

    <!-- SKILLS -->

    <section class="panel" id="skill">
        <h2>💻 My Skills</h2>
        <div class="detail">AI Using</div>
        <div class="detail">Website Creating</div>
        <div class="detail">App Making</div>
        <button class="close-btn" onclick="closePanels()">Close</button>
    </section>

    <!-- NCP GALLERY -->

    <section class="panel" id="ncp">
        <h2>🖼️ NCP</h2>

        <div class="ncp-gallery">
            <img src="ncp1.jpg" alt="NCP picture 1">
            <img src="ncp2.jpg" alt="NCP picture 2">
            <img src="ncp3.jpg" alt="NCP picture 3">
            <img src="ncp4.jpg" alt="NCP picture 4">
            <img src="ncp5.jpg" alt="NCP picture 5">
            <img src="ncp6.jpg" alt="NCP picture 6">
        </div>

        <button class="close-btn" onclick="closePanels()">Close</button>
    </section>

    <button class="menu-btn logout" onclick="logoutUser()">
        <span>⇥</span><span>│</span><span>Logout</span>
    </button>

</div>
</section>

<script>
function loginUser() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if (username !== "" && password.trim() !== "") {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("homePage").style.display = "block";
    } else {
        alert("Please enter Username and Password");
    }
}

function togglePanel(id) {
    const panel = document.getElementById(id);
    const wasOpen = panel.classList.contains("active");

    closePanels();

    if (!wasOpen) {
        panel.classList.add("active");
        panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
}

function closePanels() {
    document.querySelectorAll(".panel").forEach(function(panel) {
        panel.classList.remove("active");
    });
}

function logoutUser() {
    speechSynthesis.cancel();
    closePanels();

    document.getElementById("homePage").style.display = "none";
    document.getElementById("loginPage").style.display = "flex";

    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
}

function playWelcome() {
    if (!("speechSynthesis" in window)) {
        alert("Voice is not supported in this browser.");
        return;
    }

    const welcomeText =
        "Welcome to Nizi Web. " +
        "Hello, my friend! I am Nizi. " +
        "Welcome to my personal website. " +
        "Here, you can explore my skills, projects, and creations. " +
        "Thank you for visiting Nizi Web. Have a great day!";

    const speech = new SpeechSynthesisUtterance(welcomeText);
    speech.lang = "en-US";
    speech.volume = 1;
    speech.rate = 0.9;
    speech.pitch = 1;

    speechSynthesis.cancel();
    speechSynthesis.speak(speech);
}

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        closePanels();
    }
});
</script>

</body>
</html>
